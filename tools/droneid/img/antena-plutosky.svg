<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1180" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="1180" fill="#ffffff"/>
  <text x="450" y="44" text-anchor="middle" font-size="28" font-weight="bold" fill="#1a1a1a">Antena para a PlutoSky (DroneID, FPV, ELRS)</text>
  <text x="450" y="74" text-anchor="middle" font-size="17" fill="#555">Ligar no conector marcado RX1A. Conector da placa: SMA fêmea.</text>

  <!-- ===== Connector comparison ===== -->
  <text x="40" y="120" font-size="22" font-weight="bold" fill="#1a1a1a">1. O conector (o detalhe mais importante)</text>

  <!-- SMA male (correct) -->
  <g transform="translate(70,140)">
    <rect x="0" y="0" width="360" height="300" rx="14" fill="#eaf6ec" stroke="#2e8b47" stroke-width="3"/>
    <text x="180" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#2e8b47">CERTO: SMA macho</text>
    <!-- hex nut front view -->
    <polygon points="180,70 250,110 250,190 180,230 110,190 110,110" fill="#d9b44a" stroke="#8a6d1d" stroke-width="3"/>
    <circle cx="180" cy="150" r="52" fill="#f3e2a6" stroke="#8a6d1d" stroke-width="2"/>
    <circle cx="180" cy="150" r="30" fill="#ffffff" stroke="#999" stroke-width="2"/>
    <!-- center pin -->
    <circle cx="180" cy="150" r="9" fill="#b8860b" stroke="#5a4200" stroke-width="2"/>
    <line x1="210" y1="150" x2="300" y2="118" stroke="#2e8b47" stroke-width="2"/>
    <text x="300" y="112" font-size="16" fill="#1a1a1a" text-anchor="middle">pino no meio</text>
    <text x="180" y="262" text-anchor="middle" font-size="16" fill="#1a1a1a">rosca por dentro + PINO central</text>
    <text x="180" y="284" text-anchor="middle" font-size="15" fill="#555">procure: "SMA macho" / "SMA male"</text>
  </g>

  <!-- RP-SMA male (wrong) -->
  <g transform="translate(470,140)">
    <rect x="0" y="0" width="360" height="300" rx="14" fill="#fdecec" stroke="#c0392b" stroke-width="3"/>
    <text x="180" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#c0392b">ERRADO: RP-SMA macho</text>
    <polygon points="180,70 250,110 250,190 180,230 110,190 110,110" fill="#d9b44a" stroke="#8a6d1d" stroke-width="3"/>
    <circle cx="180" cy="150" r="52" fill="#f3e2a6" stroke="#8a6d1d" stroke-width="2"/>
    <circle cx="180" cy="150" r="30" fill="#ffffff" stroke="#999" stroke-width="2"/>
    <!-- center hole, no pin -->
    <circle cx="180" cy="150" r="9" fill="#ffffff" stroke="#333" stroke-width="3"/>
    <circle cx="180" cy="150" r="3" fill="#333"/>
    <line x1="210" y1="150" x2="300" y2="118" stroke="#c0392b" stroke-width="2"/>
    <text x="300" y="112" font-size="16" fill="#1a1a1a" text-anchor="middle">furo, sem pino</text>
    <text x="180" y="262" text-anchor="middle" font-size="16" fill="#1a1a1a">rosca igual, mas SEM pino: não conecta</text>
    <text x="180" y="284" text-anchor="middle" font-size="15" fill="#555">é o de quase toda antena de roteador Wi-Fi</text>
  </g>

  <!-- ===== Antenna options ===== -->
  <text x="40" y="490" font-size="22" font-weight="bold" fill="#1a1a1a">2. Qual antena</text>

  <!-- Option A: dual band rubber duck -->
  <g transform="translate(70,510)">
    <rect x="0" y="0" width="360" height="440" rx="14" fill="#f4f7fb" stroke="#3b6ea5" stroke-width="3"/>
    <text x="180" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#3b6ea5">Opção A: dual-band 2,4 / 5,8 GHz</text>
    <!-- antenna body -->
    <rect x="160" y="60" width="40" height="210" rx="18" fill="#222"/>
    <rect x="168" y="270" width="24" height="28" fill="#444"/>
    <!-- hinge -->
    <circle cx="180" cy="312" r="14" fill="#555"/>
    <!-- connector -->
    <polygon points="164,330 196,330 202,346 196,362 164,362 158,346" fill="#d9b44a" stroke="#8a6d1d" stroke-width="2"/>
    <rect x="172" y="362" width="16" height="14" fill="#c9a43a"/>
    <text x="230" y="170" font-size="15" fill="#1a1a1a">~10–20 cm</text>
    <text x="230" y="350" font-size="15" fill="#1a1a1a">SMA macho</text>
    <text x="180" y="402" text-anchor="middle" font-size="15" fill="#1a1a1a">DroneID 2,4/5,8 + FPV 5,8 + ELRS 2,4</text>
    <text x="180" y="424" text-anchor="middle" font-size="14" fill="#555">não cobre 868/915 MHz</text>
  </g>

  <!-- Option B: wideband -->
  <g transform="translate(470,510)">
    <rect x="0" y="0" width="360" height="440" rx="14" fill="#f4f7fb" stroke="#3b6ea5" stroke-width="3"/>
    <text x="180" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#3b6ea5">Opção B: banda larga 700 MHz–6 GHz</text>
    <rect x="158" y="52" width="44" height="232" rx="10" fill="#222"/>
    <line x1="166" y1="80" x2="194" y2="80" stroke="#444" stroke-width="2"/>
    <line x1="166" y1="140" x2="194" y2="140" stroke="#444" stroke-width="2"/>
    <rect x="168" y="284" width="24" height="18" fill="#444"/>
    <circle cx="180" cy="314" r="14" fill="#555"/>
    <polygon points="164,330 196,330 202,346 196,362 164,362 158,346" fill="#d9b44a" stroke="#8a6d1d" stroke-width="2"/>
    <rect x="172" y="362" width="16" height="14" fill="#c9a43a"/>
    <text x="232" y="170" font-size="15" fill="#1a1a1a">~18–25 cm</text>
    <text x="232" y="350" font-size="15" fill="#1a1a1a">SMA macho</text>
    <text x="180" y="402" text-anchor="middle" font-size="15" fill="#1a1a1a">tudo da opção A + ELRS 868/915</text>
    <text x="180" y="424" text-anchor="middle" font-size="14" fill="#555">"LTE/5G full band", uma antena só</text>
  </g>

  <!-- ===== Search terms ===== -->
  <g transform="translate(70,975)">
    <rect x="0" y="0" width="760" height="170" rx="14" fill="#fff8e1" stroke="#d4a017" stroke-width="3"/>
    <text x="24" y="36" font-size="20" font-weight="bold" fill="#1a1a1a">3. Termos para buscar na loja</text>
    <text x="24" y="70" font-size="17" fill="#1a1a1a">A:  "antena SMA macho dual band 2.4G 5.8G"</text>
    <text x="24" y="100" font-size="17" fill="#1a1a1a">B:  "antena SMA macho 700-6000MHz" ou "SMA male wideband 5G antenna"</text>
    <text x="24" y="134" font-size="16" fill="#555">Confira na foto do anúncio que há um PINO no centro do conector.</text>
    <text x="24" y="158" font-size="16" fill="#555">A telescópica que veio com a placa: só para abaixo de ~1 GHz.</text>
  </g>
</svg>
